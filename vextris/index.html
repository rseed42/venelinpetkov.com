<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VexTris</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  #container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
  }
  canvas {
    display: block;
  }
  #status {
    color: #999;
    font-family: monospace;
    font-size: 14px;
    padding: 6px 12px;
    text-align: center;
  }
  #overlay {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #ccc;
    font-family: monospace;
    font-size: 16px;
    text-align: center;
    line-height: 1.8;
  }
</style>
</head>
<body>
<div id="container">
  <canvas id="game"></canvas>
  <div id="status">VexTris — Press N to start</div>
</div>
<div id="overlay"></div>
<script src="dist/vextris.js"></script>
</body>
</html>
